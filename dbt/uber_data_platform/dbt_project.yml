name: 'uber_data_platform'
version: '1.0.0'
config-version: 2

profile: 'uber_data_platform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  uber_data_platform:

    staging:
      +schema: bronze_silver
      +materialized: table

    dimensions:
      +schema: gold
      +materialized: table

    facts:
      +schema: gold
      +materialized: table
